name: daily digest

on:
  schedule:
    # GitHub の cron は UTC。21:00 UTC = 日本時間 6:00。混雑時は数十分遅れることがある。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "日付 YYYY-MM-DD（空なら今日・日本時間）"
        required: false
      force:
        description: "既存の日付ファイルを上書きする"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paperfeed
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          PAPERFEED_DATE: ${{ inputs.date }}
          PAPERFEED_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$PAPERFEED_DATE" ]; then args+=(--date "$PAPERFEED_DATE"); fi
          if [ "$PAPERFEED_FORCE" = "true" ]; then args+=(--force); fi
          uv run --no-dev python -m pipeline "${args[@]}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "digest: $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

  deploy:
    needs: digest
    # push で起動したとき（digest がスキップされたとき）もデプロイする
    if: always() && (needs.digest.result == 'success' || needs.digest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
